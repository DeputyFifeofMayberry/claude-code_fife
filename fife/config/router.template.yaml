config-version: 8

# claude-fife router config (CLIProxyAPI, pinned v8.0.33)
# commercial-mode is MANDATORY here: without it the router writes error-*.log
# request dumps (headers + bodies) under auth-dir\logs, which violates the
# fife contract that no prompt/response content ever hits disk.
server:
  host: "127.0.0.1"
  port: 8317
  commercial-mode: true

access:
  api-keys:
    - "__ROUTER_LOCAL_KEY__"

oauth:
  auth-dir: "__AUTH_DIR__"

observability:
  logs:
    debug: false
    logging-to-file: false
    request-log: false

api-keys:
  claude:
    - name: zai
      base-url: "https://api.z.ai/api/anthropic"
      keys:
        - api-key: "__ZAI_API_KEY__"
      models:
        - name: "glm-5.3"
          alias: "glm-5.3"
        - name: "glm-5.3-flash"
          alias: "glm-5.3-flash"
        - name: "glm-4.7"
          alias: "glm-4.7"
    - name: openrouter
      base-url: "https://openrouter.ai/api"
      keys:
        - api-key: "__OPENROUTER_API_KEY__"
      models:
        - name: "deepseek/deepseek-v4.1-flash-1017"
          alias: "deepseek-v4.1-flash"
  openai-compatibility:
    # OpenCode Zen. Registered OpenAI-compatible because Zen's Anthropic-shaped
    # endpoint (/zen/v1/messages) rejects the forwarded key ("Missing API key"),
    # while its OpenAI-shaped endpoint accepts it as a bearer token.
    - name: opencode
      base-url: "https://opencode.ai/zen/v1"
      keys:
        - api-key: "__OPENCODE_TOKEN__"
      models:
        - name: "glm-5.3-flash"
          alias: "opencode/glm-5.3-flash"
        - name: "glm-5.3"
          alias: "opencode/glm-5.3"
        - name: "deepseek-v4.1-flash"
          alias: "opencode/deepseek-v4.1-flash"
        - name: "kimi-k3"
          alias: "opencode/kimi-k3"
        - name: "gpt-5.4"
          alias: "opencode/gpt-5.4"
        - name: "glm-5.3-flash-free"
          alias: "opencode/glm-5.3-flash-free"
        - name: "deepseek-v4.1-flash-free"
          alias: "opencode/deepseek-v4.1-flash-free"
        - name: "big-pickle"
          alias: "opencode/big-pickle"
